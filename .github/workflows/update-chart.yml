name: Update Stack Chart

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6h UTC
  push:
    branches: [main]
  workflow_dispatch: # déclenchement manuel depuis l'UI GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG chart
        run: node scripts/generate-chart.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Caro639

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/langs.svg
          git diff --staged --quiet || (git commit -m "chore: update stack chart [skip ci]" && git push)
